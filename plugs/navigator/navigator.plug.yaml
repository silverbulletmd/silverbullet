name: navigator
build:
  - in: ./ui/index.tsx
    out: ./assets/navigator.js
  - type: sass
    in: ./ui/navigator.scss
    out: ./assets/navigator.css
assets:
  - "assets/**"
functions:
  open:
    path: ./src/navigator.ts:open
  openToc:
    path: ./src/navigator.ts:openToc
    command:
      name: "Navigate: Outline"
  openTocModal:
    path: ./src/navigator.ts:openTocModal
    command:
      name: "Navigate: Outline Picker"
  openSpaceTree:
    path: ./src/navigator.ts:openSpaceTree
    command:
      name: "Navigate: Tree"
      key:
        - "Ctrl-o"
        - "Ctrl-Shift-o" # For Safari
      mac:
        - "Cmd-o"
        - "Cmd-Shift-o"
  pickOpen:
    path: ./src/navigator.ts:pickOpen
  pickSettle:
    path: ./src/navigator.ts:pickSettle
  register:
    path: ./src/registry.ts:register
  handle:
    path: ./src/registry.ts:handle
  preload:
    path: ./src/navigator.ts:preload
    events:
      - editor:init
  ready:
    path: ./src/navigator.ts:ready
    events:
      - navigator:ready
  panelHidden:
    path: ./src/navigator.ts:panelHidden
    events:
      - navigator:panelHidden
  resize:
    path: ./src/navigator.ts:resize
    events:
      - navigator:resize
  route:
    path: ./src/navigator.ts:route
    events:
      - navigator:route
