name: configuration-manager
build:
  - in: ./ui/index.tsx
    out: ./assets/configuration.js
  - type: sass
    in: ./ui/configuration.scss
    out: ./assets/configuration.css
  - type: copy
    in: ./template/CONFIG.md
    out: ./assets/CONFIG.md
assets:
  - "assets/**"
functions:
  openConfiguration:
    path: ./configuration.ts:openConfiguration
    command:
      name: "Configuration: Open"
      key: "Ctrl-,"
      mac: "Cmd-,"
      requireMode: rw
      menuMac: { location: app, group: "4_prefs", order: 1, label: "Configuration..." }
      menu: { location: file, group: "2_prefs", order: 1, label: "Configuration..." }
  openShortcuts:
    path: ./configuration.ts:openShortcuts
    command:
      name: "Configuration: Keyboard Shortcuts"
      requireMode: rw
      menuMac: { location: app, group: "4_prefs", order: 2, label: "Keyboard Shortcuts..." }
      menu: { location: file, group: "2_prefs", order: 2, label: "Keyboard Shortcuts..." }
  saveConfiguration:
    path: ./configuration.ts:saveConfiguration
  setConfigValue:
    path: ./configuration.ts:setConfigValue
