name: Extended browser coverage

# Disabled: no scheduled or pull-request runs. Start it by hand when needed.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-extended-${{ github.ref }}
  cancel-in-progress: true

jobs:
  oidc:
    # Playwright 1.58 can't install browsers on Ubuntu 26.04 (ubuntu-latest
    # since October 2026)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: Swatinem/rust-cache@v2
        with:
          # CI's test-e2e cache: the same `make build-e2e` build.
          shared-key: e2e-debug
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: make test-e2e-oidc
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-oidc
          path: test-results/
          retention-days: 7

  cross-browser:
    if: github.event_name != 'pull_request'
    # Playwright 1.58 can't install browsers on Ubuntu 26.04 (ubuntu-latest
    # since October 2026)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: Swatinem/rust-cache@v2
        with:
          # CI's test-e2e cache: the same `make build-e2e` build.
          shared-key: e2e-debug
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: make build-e2e
      - run: npx playwright test --project=${{ matrix.browser }}
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-${{ matrix.browser }}
          path: test-results/
          retention-days: 7
