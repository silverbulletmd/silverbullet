<!doctype html>
<html lang="en" prefix="og: https://ogp.me/ns#">
    <head>
        <meta charset="utf-8" />
        <meta
            content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content"
            name="viewport"
        />
        <base href="{{ host_prefix | safe }}/" />
        <link href=".client/apple-touch-icon.png" rel="apple-touch-icon" sizes="180x180" />
        <meta
            content="#fcfcfd"
            media="(prefers-color-scheme: light)"
            name="theme-color"
        />
        <meta
            content="#15171e"
            media="(prefers-color-scheme: dark)"
            name="theme-color"
        />
        <meta content="no-referrer" name="referrer" />

        <title>{{ title }}</title>
        <meta content="{{ description }}" name="description" />
        <meta content="{{ title }}" property="og:title" />
        <meta content="{{ image }}" property="og:image" />
        {% if canonical %}
        <link href="{{ canonical }}" rel="canonical" />
        <meta content="{{ canonical }}" property="og:url" />
        {% endif %}
        {% if noindex %}
        <meta content="noindex, follow" name="robots" />
        {% endif %}
        <meta content="{{ description }}" property="og:description" />

        <link href=".client/main.css" rel="stylesheet" />
        <!--
            WebKit has no requestIdleCallback. Without it, CodeMirror's
            background syntax parser falls back to fixed 500ms pauses between
            parse chunks, so scrolling into a not-yet-parsed region shows raw
            markdown for half a second before live preview kicks in.
        -->
        <script>
            globalThis.requestIdleCallback ||= (callback) =>
                setTimeout(() => {
                    const start = Date.now();
                    callback({
                        didTimeout: false,
                        timeRemaining: () =>
                            Math.max(0, 50 - (Date.now() - start)),
                    });
                }, 16);
            globalThis.cancelIdleCallback ||= (id) => clearTimeout(id);
        </script>
        <script src=".client/client.js" type="module"></script>
        <!-- sb:preloads -->
        <link
            crossorigin="use-credentials"
            href=".client/manifest.json"
            rel="manifest"
        />
        <link rel="icon" type="image/png" href=".client/favicon-96x96.png" sizes="96x96" />
        <link rel="icon" type="image/svg+xml" href=".client/favicon.svg" />
        <link rel="shortcut icon" href=".client/favicon.ico" />
        {{ additional_head_html | safe }}
    </head>

    <body>
        <div id="sb-root">
            <div id="sb-main">
                <div id="sb-editor">
                    <div class="cm-editor">
                        <div class="cm-content">{{ content | safe }}</div>
                    </div>
                </div>
            </div>
        </div>
        <!-- Inline, not in main.css: it must show while the bundle is still
             downloading. The delay keeps it from flashing on a fast boot. -->
        <style>
            #sb-boot-indicator {
                position: fixed;
                inset: 40vh 0 auto 0;
                z-index: 50;
                display: flex;
                justify-content: center;
                align-items: center;
                gap: 0.6em;
                font: 14px system-ui, -apple-system, sans-serif;
                color: #8a8f98;
                pointer-events: none;
                animation: sb-boot-appear 0.3s ease-out 1s both;
            }
            #sb-boot-indicator .sb-boot-spinner {
                width: 14px;
                height: 14px;
                border: 2px solid currentColor;
                border-top-color: transparent;
                border-radius: 50%;
                animation: sb-boot-spin 0.8s linear infinite;
            }
            /* Server-rendered content (public spaces) is already something
               to look at; CodeMirror's own content sits in .cm-scroller */
            body:has(.cm-editor > .cm-content:not(:empty)) #sb-boot-indicator {
                display: none;
            }
            @keyframes sb-boot-appear {
                from { opacity: 0; }
                to { opacity: 1; }
            }
            @keyframes sb-boot-spin {
                to { transform: rotate(360deg); }
            }
        </style>
        <div id="sb-boot-indicator" role="status" aria-live="polite">
            <div class="sb-boot-spinner"></div>
            <span class="sb-boot-label">Loading SilverBullet…</span>
        </div>
        <!-- In this order: at equal specificity the later wins, so the theme
             beats the fonts and the space's styles beat both -->
        <style id="sb-fonts"></style>
        <div id="sb-theme"></div>
        <div id="custom-styles"></div>
    </body>
</html>
