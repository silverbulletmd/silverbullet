[package]
name = "silverbullet-server"
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
silverbullet-server-common = { path = "../server-common" }
silverbullet-server-merge = { path = "../server-merge" }
axum = { workspace = true }
tower-http = { workspace = true, features = ["compression-gzip", "compression-br"] }
tokio = { workspace = true, features = ["time"] }
serde_json = { workspace = true }
tracing = { workspace = true }
jsonwebtoken = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
getrandom = { workspace = true }
base64 = { workspace = true }
serde = { workspace = true }
reqwest = { workspace = true }
regex = { workspace = true }
chrono = { workspace = true }
percent-encoding = { workspace = true }
pulldown-cmark = { workspace = true }
minijinja = { workspace = true }
prometheus = { workspace = true }
thiserror = { workspace = true }
argon2 = { workspace = true }
uuid = { workspace = true }
tower = { version = "0.5", features = ["util"] }
notify = { workspace = true }
tokio-stream = { workspace = true }
openidconnect = { workspace = true, optional = true }

[features]
oidc = ["dep:openidconnect"]

[dev-dependencies]
silverbullet-server-common = { path = "../server-common", features = ["testing"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "test-util"] }
tempfile = "3"
