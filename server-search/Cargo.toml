[package]
name = "silverbullet-server-search"
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[features]
default = ["semantic"]
semantic = ["dep:candle-core", "dep:candle-nn", "dep:tokenizers", "dep:rayon", "dep:reqwest", "dep:sha2", "tokio/fs"]
test-model = ["semantic"]

[dependencies]
silverbullet-server-common = { path = "../server-common" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
base64 = { workspace = true }
tokio = { workspace = true, features = ["io-util", "time", "sync", "rt", "macros"] }
tokio-util = { workspace = true }
tantivy = { workspace = true }
candle-core = { workspace = true, optional = true }
candle-nn = { workspace = true, optional = true }
tokenizers = { workspace = true, optional = true }
rayon = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["io-util", "time", "sync", "rt", "rt-multi-thread", "macros", "test-util", "net"] }
tempfile = { workspace = true }
libc = { workspace = true }
