# Dex OIDC Provider — test configuration for the SilverBullet OIDC feature.
# Static users + SQLite, no external dependencies.

issuer: http://localhost:5556/dex

storage:
  type: sqlite3
  config:
    file: /var/dex/dex.db

web:
  http: 0.0.0.0:5556

telemetry:
  http: 0.0.0.0:5558

logger:
  level: "debug"
  format: "text"

oauth2:
  responseTypes: ["code"]
  skipApprovalScreen: true
  alwaysShowLoginScreen: false

staticClients:
  - id: silverbullet
    secret: secret
    name: "SilverBullet"
    redirectURIs:
      - "http://localhost:3000/.oidc/callback"

enablePasswordDB: true

staticPasswords:
  # bcrypt hash of "password" (cost 10)
  - email: "admin@example.com"
    hash: "$2a$10$2b2cU8CPhOTaGrs1HRQuAueS7JTT5ZHsHSzYiFPm1leZck7Mc8T4W"
    username: "admin"
    name: "Admin User"
    emailVerified: true
    preferredUsername: "admin"
    groups:
      - "admin"
      - "users"
    userID: "08a8684b-db88-4b73-90a9-3cd1661f5466"

signer:
  type: local
  config:
    keysRotationPeriod: "6h"
    algorithm: "RS256"

expiry:
  idTokens: "24h"
  refreshTokens:
    disableRotation: false
    reuseInterval: "3s"
    validIfNotUsedFor: "2160h"
    absoluteLifetime: "3960h"
